name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  check:
    name: Check (fmt + clippy + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tcms
          POSTGRES_PASSWORD: tcms_pass
          POSTGRES_DB: hoa_tcms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Apply database migrations
        run: |
          PGPASSWORD=tcms_pass psql -h localhost -U tcms -d hoa_tcms_test -f migrations/001_initial_schema.sql
          PGPASSWORD=tcms_pass psql -h localhost -U tcms -d hoa_tcms_test -f migrations/002_seed_permissions.sql

      - name: Run tests
        run: cargo test --all-features
        env:
          DATABASE_URL: postgres://tcms:tcms_pass@localhost:5432/hoa_tcms_test
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-test-secret-not-for-production
          FILE_STORAGE_PATH: /tmp/tcms-storage
          RUST_LOG: warn
