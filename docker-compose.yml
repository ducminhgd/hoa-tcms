services:
  postgres:
    image: postgres:15
    container_name: hoa-tcms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tcms
      POSTGRES_PASSWORD: tcms_pass
      POSTGRES_DB: hoa_tcms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations are managed by the `migrate` service (sqlx-cli), not docker initdb.
      # - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tcms -d hoa_tcms -q || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"

  redis:
    image: redis:7
    container_name: hoa-tcms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot init: apply migrations + seed reference data, then exit.
  # The backend waits for this via `service_completed_successfully`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoa-tcms-migrate
    entrypoint: ["/usr/local/bin/migrate-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://tcms:tcms_pass@postgres:5432/hoa_tcms
      SETUP_CONFIG_PATH: config/default-setup.yaml
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoa-tcms-backend
    command: ["/usr/local/bin/server"]
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://tcms:tcms_pass@postgres:5432/hoa_tcms
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      DB_MAX_CONNECTIONS: "10"
      UPLOAD_BASE_DIR: /app/uploads
      MAX_FILE_SIZE: "10485760"
      SETUP_CONFIG_PATH: config/default-setup.yaml
      METADATA_CONFIG_PATH: config/default-metadata.yaml
    volumes:
      - uploads_data:/app/uploads
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hoa-tcms-frontend
    ports:
      - "3000:3000"
    environment:
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      LEPTOS_SITE_ROOT: /app/site
      LEPTOS_ENV: PROD
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
